[package]
name = "bundle_repo"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
description = "Pack a local or remote Git Repository to XML for LLM Consumption."
readme = "README-cratesio.md"
repository = "https://github.com/seapagan/bundle-repo/"
license = "MIT"
keywords = ["ai", "cli", "git", "llm", "tokenizer"]
categories = [
  "command-line-utilities",
  "development-tools",
  "parsing",
  "text-processing",
]
include = ["LICENSE.txt", "README-cratesio.md", "resources/**", "src/**"]

[[bin]]
name = "bundlerepo"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.4.1", default-features = false, features = [
  "windows-sys",
] }
casefold = "=0.1.0"
chardetng = "1.0.0"
clap = { version = "4.1", features = ["derive"] }
colored_text = "0.5.1"
config = "0.15.0"
dirs-next = "2.0.0"
encoding_rs = "0.8.33"
flate2 = "1.1.9"
git2 = { version = "0.21.0", features = ["https", "ssh"] }
glob = "=0.3.4"
icu_decimal = { version = "2.3.0", features = ["alloc"] }
icu_locale_core = "2.3.0"
ignore = "0.4"
infer = "0.22.0"
regex = "1"
rust-embed = { version = "8.12.0", features = [
  "compression",
  "include-exclude",
] }
same-file = "=1.0.6"
secrets_scanner = { version = "=0.2.3", default-features = false }
serde = { version = "1.0.214", features = ["derive"] }
tabled = "0.22.0"
tempfile = "3.8"
tiktoken-rs = "0.12.0"
tokenizers = "0.23"
toml = { version = "=1.1.6", default-features = false, features = [
  "display",
  "parse",
  "serde",
] }
toml_parser = { version = "=1.1.3", default-features = false, features = ["alloc"] }
url = "2.2"
xml = "1.0"

[dev-dependencies]
fs_extra = "1.3"
sha2 = "0.11"

[target.'cfg(any(windows, target_vendor = "apple"))'.dependencies]
sys-locale = "0.3.2"

[features]
default = []

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 2
