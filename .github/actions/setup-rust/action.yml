name: Set up Rust
description: Install the exact Rust toolchain and optional components

inputs:
  toolchain:
    description: Exact Rust toolchain version
    required: true
  components:
    description: Space-separated rustup components to install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install exact Rust toolchain
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        rustup toolchain install "$TOOLCHAIN" --profile minimal
        rustup default "$TOOLCHAIN"

        components=()
        read -ra components <<< "$COMPONENTS"
        if (( ${#components[@]} > 0 )); then
          rustup component add --toolchain "$TOOLCHAIN" "${components[@]}"
        fi
