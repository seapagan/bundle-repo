name: Advisory Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: 1.97.1

jobs:
  quality:
    name: Advisory quality (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
            slug: linux
          - platform: Windows
            os: windows-latest
            slug: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-${{ runner.os }}-rust-${{ env.RUST_VERSION }}
          shared-key: advisory-quality-${{ matrix.slug }}

      - name: Install Cargo Make
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-make@0.37.24

      - name: Run advisory quality checks
        shell: bash
        run: |
          set -o pipefail
          cargo make quality 2>&1 | tee quality.log

      - name: Build advisory report
        shell: bash
        env:
          QUALITY_PLATFORM: ${{ matrix.platform }}
          QUALITY_SLUG: ${{ matrix.slug }}
        run: |
          report="quality-${QUALITY_SLUG}.md"
          findings="quality-${QUALITY_SLUG}.json"
          count="$(python .github/scripts/advisory_quality_report.py platform \
            quality.log "$report" "$findings" "$QUALITY_PLATFORM")"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          if (( count > 0 )); then
            echo "::warning title=Advisory maintainability::$count findings detected on $QUALITY_PLATFORM; see the Advisory quality summary."
          fi

      - name: Upload advisory report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: advisory-quality-${{ matrix.slug }}
          path: |
            quality-${{ matrix.slug }}.md
            quality-${{ matrix.slug }}.json
          if-no-files-found: error
          retention-days: 1

  quality-aggregate:
    name: Advisory quality aggregate
    needs: quality
    runs-on: ubuntu-24.04

    permissions:
      actions: read # Download native advisory-quality artifacts.
      contents: read # Check out the tested revision without persisted credentials.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux advisory report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: advisory-quality-linux
          path: quality-reports

      - name: Download Windows advisory report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: advisory-quality-windows
          path: quality-reports

      - name: Test advisory report aggregation
        run: python -m unittest tests/scripts/test_advisory_quality_report.py

      - name: Build sticky comment
        run: |
          python .github/scripts/advisory_quality_report.py combine \
            quality-comment.md \
            quality-reports/quality-linux.json \
            quality-reports/quality-windows.json

      - name: Upload advisory comment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: advisory-quality-comment
          path: quality-comment.md
          if-no-files-found: error
          retention-days: 1

  quality-report:
    name: Advisory quality report
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: quality-aggregate
    runs-on: ubuntu-24.04

    permissions:
      actions: read # Download the finished advisory comment artifact.
      pull-requests: write # Create or update the marker-based sticky PR comment.

    steps:
      - name: Download advisory comment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: advisory-quality-comment

      - name: Verify advisory comment
        shell: bash
        run: test -s quality-comment.md

      - name: Create or update sticky comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- bundlerepo-advisory-quality -->'
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"$marker\")) | .id" \
            > quality-comment-ids.txt
          comment_id="$(sed -n '1p' quality-comment-ids.txt)"
          body="$(< quality-comment.md)"

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --raw-field body="$body"
          else
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --raw-field body="$body"
          fi
